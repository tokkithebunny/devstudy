<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css practice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./csspractice.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Single+Day&display=swap" rel="stylesheet">
    <style> /* 삭제 버튼 위에 마우스 올리면 커서를 포인터로 변경 */
        .badge {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <h3 id="title">나의 투두리스트</h3>
        <div id="sub-container">
            <ul class="list-group" id="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center list-0">
                오늘의 할 일 목록 하나
                <span class="badge text-bg-primary rounded-pill" onclick="deleteTodo(0)">삭제</span>
             </li>
            </ul>
        </div>
        <div class="input-group mb-3" id="input-group">
            <input type="text" class="form-control" id="input-area" placeholder="to-do item" aria-label="to-do item" aria-describedby="basic-addon1"/>
            <button class="input-group-text" id="button-area" onclick="addTodo()">추가</button>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function addTodo(){
            let todo = $("#input-area").val();
            console.log(todo);
            let id = Math.floor(Math.random() * 100000); 
            // Math: 수학 관련 함수 묶음
            // random: 랜덤한 id 생성. 여기에 100000을 곱하고 floor 로 반올림해서 정수로 변환

            let list_item = `<li class="list-group-item d-flex justify-content-between align-items-center list-${id}" id="list-group-item">
                ${todo}
                <span class="badge text-bg-primary rounded-pill" onclick="deleteTodo(${id})">삭제</span>
             </li>`; // 백틱(``)을 사용하여 문자열을 감싸고, ${todo}를 사용하여 li태그 안에 변수 값을 삽입
             
             $("#list-group").append(list_item); //append() 함수를 사용하여 새로운 li 요소를 ul(list-group)에 추가
             $("#input-area").val(""); // ""로 빈 값 세팅, 입력창 초기화

        }

        function deleteTodo(id){
            $(".list-"+id).remove(); // remove() 함수를 사용하여 해당 li 요소를 삭제
        }

    </script>
</body>
</html>
